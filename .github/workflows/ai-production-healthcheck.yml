name: FXA AI production health check

on:
  push:
    branches:
      - ai-healthcheck-20260907

permissions:
  contents: read

jobs:
  claude-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test production Claude endpoint
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          status="$(curl --silent --show-error --location --max-time 30 -o "$tmp" -w '%{http_code}' https://www.fxafitness.app/api/ai/test || true)"
          body="$(cat "$tmp")"
          printf 'HTTP %s\n' "$status"
          printf '%s\n' "$body"
          STATUS="$status" BODY="$body" python3 - <<'PY'
          import json, os, sys
          status = os.environ['STATUS']
          body = os.environ['BODY']
          try:
              data = json.loads(body)
          except Exception:
              print('Non-JSON body:', body)
              sys.exit(1)
          if status != '200':
              print('Claude endpoint failed:', data)
              sys.exit(1)
          assert data.get('success') is True, data
          message = str(data.get('message', '')).strip()
          assert message == 'FXA Claude connection is working.', message
          print('Claude production health check passed.')
          PY
