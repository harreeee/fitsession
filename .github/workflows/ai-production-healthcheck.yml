name: FXA staff production health check

on:
  push:
    branches:
      - ai-healthcheck-20260907

permissions:
  contents: read

jobs:
  staff-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected staff routes are deployed
        shell: bash
        run: |
          set -euo pipefail
          for path in access revenue clients booked-calendar; do
            status="$(curl --silent --show-error --location --max-time 20 -o /tmp/staff-body -w '%{http_code}' "https://www.fxafitness.app/api/staff/$path" || true)"
            printf '%s -> HTTP %s\n' "$path" "$status"
            cat /tmp/staff-body || true
            printf '\n'
            case "$status" in
              401|403) ;;
              *) echo "Expected protected staff route to reject unauthenticated request"; exit 1;;
            esac
          done
          echo 'Protected staff routes are deployed and enforcing authentication.'
