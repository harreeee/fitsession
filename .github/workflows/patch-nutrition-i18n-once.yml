name: Patch Nutrition Access And Language Toggle Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply patch
        run: python3 scripts/patch_nutrition_i18n.py

      - name: Install dependencies
        run: npm ci

      - name: Install isolated test dependencies
        run: npm ci --prefix tests --ignore-scripts

      - name: TypeScript check
        run: npm run typecheck

      - name: Booking regression tests
        run: npm run test:repair

      - name: Remove one-time patch files
        run: |
          rm -f scripts/patch_nutrition_i18n.py
          rmdir scripts 2>/dev/null || true
          rm -f .github/workflows/patch-nutrition-i18n-once.yml

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix nutrition coach visibility and add language toggle"
          git push origin HEAD:main
