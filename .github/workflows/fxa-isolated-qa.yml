name: FXA isolated QA - no deploy
on:
  push:
    branches: [repair/core-booking-20260907]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated test tools
        run: |
          mkdir -p /tmp/fxa-test-tools
          npm install --prefix /tmp/fxa-test-tools --save-exact @electric-sql/pglite@0.3.7 pg@8.16.3
          tar -czf fxa-test-tools.tar.gz -C /tmp/fxa-test-tools node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: fxa-test-tools
          path: fxa-test-tools.tar.gz
          retention-days: 1
