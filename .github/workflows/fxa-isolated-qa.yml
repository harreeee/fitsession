name: FXA isolated QA - no deploy
on:
  push:
    branches: [repair/core-booking-20260907]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local verification tools (no app secrets)
        run: |
          mkdir -p /tmp/fxa-browser-tools
          npm install --prefix /tmp/fxa-browser-tools --save-exact agent-browser supabase
          /tmp/fxa-browser-tools/node_modules/.bin/agent-browser install
          curl -fsSL https://supabase.com/changelog.md -o /tmp/fxa-browser-tools/supabase-changelog.md
          tar -czf fxa-browser-tools.tar.gz -C /tmp/fxa-browser-tools node_modules supabase-changelog.md
          tar -czf fxa-browser-cache.tar.gz -C "$HOME/.agent-browser" browsers
      - uses: actions/upload-artifact@v4
        with:
          name: fxa-browser-tools
          path: |
            fxa-browser-tools.tar.gz
            fxa-browser-cache.tar.gz
          retention-days: 1
