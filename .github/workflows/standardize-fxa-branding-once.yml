name: Standardize FXA Branding Once

on:
  push:
    branches:
      - brand/fxa-logo-ui-20260908

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v4
        with:
          ref: brand/fxa-logo-ui-20260908
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply branding patch
        run: python3 scripts/standardize_fxa_branding.py

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Remove one-time patch tooling
        run: |
          rm -f scripts/standardize_fxa_branding.py
          rm -f .github/workflows/standardize-fxa-branding-once.yml

      - name: Commit verified branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes to commit."
            exit 0
          fi
          git commit -m "Standardize FXA logos across app UI"
          git push origin HEAD:brand/fxa-logo-ui-20260908
